template: testify

packages:
  board-game-tracker/internal/service:
    config:
      dir: "{{.InterfaceDir}}/mocks"
      pkgname: mocks
      filename: "{{snakecase .InterfaceName}}_mock.go"
      structname: "{{.Mock}}{{.InterfaceName}}"
    interfaces:
      GameRepository:
      CollectionRepository:
      GameGetter:

  board-game-tracker/internal/handler/cli:
    config:
      dir: "{{.InterfaceDir}}/mocks"
      pkgname: mocks
      filename: "{{snakecase .InterfaceName}}_mock.go"
      structname: "{{.Mock}}{{.InterfaceName}}"
    interfaces:
      GameService:

  board-game-tracker/internal/handler/api:
    config:
      dir: "{{.InterfaceDir}}/mocks"
      pkgname: mocks
      filename: "{{snakecase .InterfaceName}}_mock.go"
      structname: "{{.Mock}}{{.InterfaceName}}"
    interfaces:
      GameService:
      CollectionService:
