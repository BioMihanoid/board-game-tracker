name: Push CI

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

# Если отправил новый commit в ту же ветку,
# старую проверку можно отменить.
concurrency:
  group: push-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-main:
    name: Sync with main
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch main
        run: git fetch origin main

      - name: Check whether branch is behind main
        id: check
        run: |
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "behind=false" >> "$GITHUB_OUTPUT"
            echo "Branch is up to date with main"
          else
            echo "behind=true" >> "$GITHUB_OUTPUT"
            echo "Branch needs to merge main"
          fi

      - name: Merge main
        if: steps.check.outputs.behind == 'true'
        run: git merge --no-edit origin/main

      - name: Push updated branch
        if: steps.check.outputs.behind == 'true'
        run: git push origin HEAD:${{ github.ref_name }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: sync-main
    if: |
      always() &&
      (needs.sync-main.result == 'success' || needs.sync-main.result == 'skipped')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: sync-main
    if: |
      always() &&
      (needs.sync-main.result == 'success' || needs.sync-main.result == 'skipped')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with coverage
        run: go test -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 1

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: sync-main
    if: |
      always() &&
      (needs.sync-main.result == 'success' || needs.sync-main.result == 'skipped')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build application
        run: go build ./...

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: sync-main
    if: |
      always() &&
      (needs.sync-main.result == 'success' || needs.sync-main.result == 'skipped')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  coverage-diff:
    name: Coverage diff
    runs-on: ubuntu-latest
    needs: test
    if: github.ref != 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Run tests with coverage
        run: go test -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Install gocovdiff
        run: go install github.com/vearutop/gocovdiff@latest

      - name: Fetch main branch
        run: git fetch origin main

      - name: Check changed code coverage
        env:
          BASE_SHA: origin/main
        run: |
          git cat-file -e "${BASE_SHA}^{commit}"

          gocovdiff \
            -parent "$BASE_SHA" \
            -cov coverage.out \
            -delta-cov-file delta-coverage.txt \
            -target-delta-cov 50

  coverage-full:
    name: Coverage full
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Check total coverage
        run: |
          go tool cover -func=coverage.out

          TOTAL=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | sed 's/%//')

          echo "Total coverage: ${TOTAL}%"

          if awk "BEGIN { exit !($TOTAL < 0) }"; then
            echo "Coverage is below 0%"
            exit 1
          fi

          echo "Coverage threshold passed"

  test-race:
    name: Test race
    runs-on: ubuntu-latest
    needs: sync-main
    if: |
      always() &&
      (needs.sync-main.result == 'success' || needs.sync-main.result == 'skipped')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run race detector
        run: go test -race ./...

  go-mod-tidy:
    name: Go mod tidy
    runs-on: ubuntu-latest
    needs: sync-main
    if: |
      always() &&
      (needs.sync-main.result == 'success' || needs.sync-main.result == 'skipped')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go.mod and go.sum
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    needs: sync-main
    if: |
      always() &&
      (needs.sync-main.result == 'success' || needs.sync-main.result == 'skipped')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
