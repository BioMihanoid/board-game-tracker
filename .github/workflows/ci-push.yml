name: Push CI

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

# Если отправил новый commit в ту же ветку,
# старую проверку можно отменить.
concurrency:
  group: push-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build application
        run: go build ./...

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  coverage-diff:
    name: Coverage diff
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with coverage
        run: go test -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Install gocovdiff
        run: go install github.com/vearutop/gocovdiff@latest

      - name: Fetch main branch
        run: git fetch origin main

      - name: Check changed code coverage
        env:
          BASE_SHA: origin/main
        run: |
          git cat-file -e "${BASE_SHA}^{commit}"

          gocovdiff \
            -parent "$BASE_SHA" \
            -cov coverage.out \
            -delta-cov-file delta-coverage.txt \
            -target-delta-cov 50

  coverage-full:
    name: Coverage full
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with coverage
        run: go test -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Check total coverage
        run: |
          go tool cover -func=coverage.out
          
          TOTAL=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | sed 's/%//')
          
          echo "Total coverage: ${TOTAL}%"
          
          if awk "BEGIN { exit !($TOTAL < 0) }"; then
            echo "Coverage is below 0%"
            exit 1
          fi
          
          echo "Coverage threshold passed"